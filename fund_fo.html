/* ================= 아톰 헬퍼 ================= */
function badge(text, tone) {
  tone = tone || "blue";
  const tones = { blue:"bg-blue-50 text-[#0C447C]", gray:"bg-gray-100 text-gray-600", red:"bg-red-50 text-red-700", amber:"bg-amber-50 text-amber-700", green:"bg-green-50 text-green-700" };
  return `<span class="text-[11px] px-2 py-0.5 rounded font-medium ${tones[tone]}">${text}</span>`;
}
function statusPill(label, tone) {
  tone = tone || "gray";
  const map = { gray:"bg-gray-100 text-gray-600", blue:"bg-blue-50 text-blue-700", green:"bg-green-50 text-green-700", amber:"bg-amber-50 text-amber-700", red:"bg-red-50 text-red-700" };
  return `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${map[tone]}">${label}</span>`;
}
function scrHeader(sfr, name, screenId, note) {
  return `<div class="mb-4">
    <div class="flex items-center gap-2 mb-1">${badge(sfr,"blue")}${badge(screenId,"gray")}</div>
    <h1 class="text-lg font-medium text-gray-900">${name}</h1>
    ${note ? `<p class="text-xs text-gray-500 mt-1">${note}</p>` : ""}
  </div>`;
}
function card(iconName, title, body, tag) {
  return `<div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
      ${iconName ? ic(iconName, "w-[17px] h-[17px]") : ""}
      <h2 class="text-[15px] font-medium text-gray-900">${title}</h2>
      ${tag ? `<span class="ml-auto">${tag}</span>` : ""}
    </div>
    ${body}
  </div>`;
}
function subCard(iconName, title, body) {
  return `<div class="border border-gray-200 rounded-lg p-4 bg-gray-50/60">
    <div class="flex items-center gap-1.5 mb-2.5">${iconName ? ic(iconName,"w-[14px] h-[14px] text-gray-400") : ""}<h3 class="text-[12.5px] font-semibold text-gray-700">${title}</h3></div>
    ${body}
  </div>`;
}
function field(label, required, body, hint) {
  return `<div class="mb-3">
    <label class="text-[13px] font-medium text-gray-700 block mb-1.5">${label} ${required ? '<span class="text-red-600">*</span>' : ""}</label>
    ${body}
    ${hint ? `<p class="text-[11px] text-gray-400 mt-1">${hint}</p>` : ""}
  </div>`;
}
function inp(placeholder, extra) {
  return `<input placeholder="${placeholder || ""}" ${extra || ""} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px]" />`;
}
function sel(options, extra) {
  return `<select ${extra || ""} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px] bg-white">${options.map(o=>`<option>${o}</option>`).join("")}</select>`;
}
function ta(placeholder, rows) {
  return `<textarea placeholder="${placeholder || ""}" rows="${rows || 3}" class="w-full border border-gray-300 rounded-md p-2 text-[13px]"></textarea>`;
}
function btn(label, opts) {
  opts = opts || {};
  const size = opts.small ? "px-3 py-1.5 text-[12px]" : "px-4 py-2 text-[13px]";
  const style = opts.primary ? `style="background:${NAVY}" class="text-white border border-transparent"` : `class="text-gray-700 border border-gray-300 bg-white hover:bg-gray-50"`;
  const nav = opts.nav ? `data-nav="${opts.nav}"` : "";
  return `<button type="button" ${nav} ${style.replace('class="', `class="inline-flex items-center gap-1.5 rounded-md font-medium ${size} `)}>
    ${opts.icon ? ic(opts.icon, "w-[14px] h-[14px]") : ""}${label}
  </button>`;
}
function table(cols, rows, navFn) {
  return `<div class="border border-gray-200 rounded-lg overflow-hidden overflow-x-auto">
    <table class="w-full text-[12px]">
      <thead><tr class="bg-gray-50 text-gray-500">${cols.map(c=>`<th class="text-left font-medium px-3 py-2 border-b border-gray-200 whitespace-nowrap">${c}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r,i)=>{
        const nav = navFn ? navFn(i) : null;
        return `<tr ${nav ? `data-nav="${nav}" class="border-b border-gray-100 last:border-0 cursor-pointer hover:bg-blue-50/60"` : `class="border-b border-gray-100 last:border-0"`}>${r.map(c=>`<td class="px-3 py-2 text-gray-700 whitespace-nowrap">${c}</td>`).join("")}</tr>`;
      }).join("")}</tbody>
    </table>
  </div>`;
}
function checklist(items) {
  return `<div class="space-y-2">${items.map((it,i)=>`<label class="flex items-center gap-2 text-[13px] text-gray-700"><input type="checkbox" ${i%2===0?"checked":""} class="rounded border-gray-300"/>${it}</label>`).join("")}</div>`;
}
function ipNotice() {
  return `<div class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-md px-3 py-2 text-[12px] text-amber-800 mb-4">${ic("shield-check","w-[14px] h-[14px]")}지정된 IP에서만 접속 가능한 특수고객 창구입니다 (SFR-온기업-002 인증 정책 · 외부 이해관계자-내부 업무시스템 실시간 연계)</div>`;
}
function backBar(to, label) {
  return `<button type="button" data-nav="${to}" class="flex items-center gap-1.5 text-[12px] font-medium text-gray-500 hover:text-[#005088] mb-4">${ic("arrow-left","w-[14px] h-[14px]")}${label} 목록으로</button>`;
}
function infoGrid(items) {
  return `<div class="grid grid-cols-2 gap-x-6 gap-y-3">${items.map(([l,v])=>`<div><p class="text-[11px] text-gray-400 mb-0.5">${l}</p><p class="text-[13px] text-gray-800 font-medium">${v}</p></div>`).join("")}</div>`;
}
function timeline(steps, current) {
  return `<div class="flex items-center">${steps.map((s,i)=>{
    const done = i <= current;
    const circle = i < current
      ? `<div class="w-7 h-7 rounded-full flex items-center justify-center text-white" style="background:${NAVY}">${ic("check-circle-2","w-[14px] h-[14px]")}</div>`
      : `<div class="w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-medium ${done?'text-white':'bg-white border border-gray-300 text-gray-400'}" ${done?`style="background:${NAVY}"`:""}>${i+1}</div>`;
    const line = i < steps.length-1 ? `<div class="flex-1 h-0.5 mb-5" style="background:${i<current?NAVY:'#E5E7EB'}"></div>` : "";
    return `<div class="flex flex-col items-center flex-1">${circle}<span class="text-[10.5px] mt-1.5 text-center ${done?'font-medium':'text-gray-400'}" ${done?`style="color:${NAVY}"`:""}>${s}</span></div>${line}`;
  }).join("")}</div>`;
}
function gnb(title, sub) {
  return `<div>

/* ================= FO-BO 필드 단위 연계(ICD) 표시 헬퍼 ================= */
function boLink(codes, note) {
  const chips = codes.map(c => {
    const gap = /확인필요/.test(c);
    return `<span class="inline-flex items-center gap-1.5 text-[11px] font-mono font-semibold px-2.5 py-1 rounded-full border ${gap ? 'bg-amber-50 border-amber-200 text-amber-800' : ''}"
      ${gap ? '' : `style="color:${NAVY_DARK};background:#E6EDFA;border-color:#C9D9F5"`}>
      ${ic(gap ? "alert-triangle" : "link-2", "w-3 h-3")}${c}
    </span>`;
  }).join("");
  return `<div class="flex flex-wrap items-center gap-2 mb-4">
    <span class="text-[11px] text-gray-400 font-medium">BO 연계 요건</span>${chips}
    ${note ? `<span class="text-[11px] text-gray-400">${note}</span>` : ""}
  </div>`;
}
function fBadge(kind) {
  const map = {
    new:  ["신규", "bg-green-50 text-green-700"],
    calc: ["자동계산", "bg-amber-50 text-amber-700"],
    gap:  ["확인필요", "bg-red-50 text-red-700"],
    ext:  ["BO확장", "bg-indigo-50 text-indigo-700"],
  };
  const [label, cls] = map[kind] || map.new;
  return `<span class="text-[9.5px] font-bold px-1.5 py-0.5 rounded ${cls} align-middle ml-1.5">${label}</span>`;
}
function boChip(code){
  return `<span class="text-[10px] font-mono font-semibold text-gray-400 ml-1.5 align-middle">[${code}]</span>`;
}
function gapBox(html, title) {
  return `<div class="mt-4 p-3.5 rounded-lg bg-red-50 border border-red-200 text-[11.5px] text-red-800 leading-relaxed flex gap-2">

  </div>`;
}
function fieldMapTable(rows) {
  // rows: [FO필드, BO필드/기능, BO출처, 비고]

    <table class="w-full text-[11.5px]">

}
function statCard(num, label){

function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "") || "/000";
  const segs = raw.split("/").filter(Boolean);
  return { screenId: segs[0] || "000", detailId: segs[1], raw: "/" + segs.join("/") };
}

  const renderer = RENDERERS[screenId] || RENDERERS["000"];
  document.getElementById("content").innerHTML = renderer(detailId);
  document.getElementById("pathbar").innerHTML = `<span>#${raw}</span>${detailId?` <span class="text-gray-300">/</span> <span class="text-gray-500">상세보기</span>`:""}`;
  if (window.lucide) lucide.createIcons();
  window.scrollTo(0,0);
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-nav]");
  if (el) { e.preventDefault(); location.hash = el.getAttribute("data-nav"); }
});
window.addEventListener("hashchange", renderApp);
window.addEventListener("DOMContentLoaded", renderApp);
</script>
</body>
</html>
