/* ================= 아톰 헬퍼 ================= */
function badge(text, tone) {
  tone = tone || "blue";
  const tones = { blue:"bg-blue-50 text-[#0C447C]", gray:"bg-gray-100 text-gray-600", red:"bg-red-50 text-red-700", amber:"bg-amber-50 text-amber-700", green:"bg-green-50 text-green-700" };
  return `<span class="text-[11px] px-2 py-0.5 rounded font-medium ${tones[tone]}">${text}</span>`;
}
function statusPill(label, tone) {
  tone = tone || "gray";
  const map = { gray:"bg-gray-100 text-gray-600", blue:"bg-blue-50 text-blue-700", green:"bg-green-50 text-green-700", amber:"bg-amber-50 text-amber-700", red:"bg-red-50 text-red-700" };
  return `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${map[tone]}">${label}</span>`;
}
function scrHeader(sfr, name, screenId, note) {
  return `<div class="mb-5">
    <div class="flex items-center gap-2 mb-1">${badge(sfr,"blue")}${badge(screenId,"gray")}</div>
    <h1 class="text-lg font-medium text-gray-900">${name}</h1>
    ${note ? `<p class="text-xs text-gray-500 mt-1">${note}</p>` : ""}
  </div>`;
}
function card(iconName, title, body, tag) {
  return `<div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
      ${iconName ? ic(iconName, "w-[17px] h-[17px]") : ""}
      <h2 class="text-[15px] font-medium text-gray-900">${title}</h2>
      ${tag ? `<span class="ml-auto">${tag}</span>` : ""}
    </div>
    ${body}
  </div>`;
}
function field(label, required, body, hint) {
  return `<div class="mb-3">
    <label class="text-[13px] font-medium text-gray-700 block mb-1.5">${label} ${required ? '<span class="text-red-600">*</span>' : ""}</label>
    ${body}
    ${hint ? `<p class="text-[11px] text-gray-400 mt-1">${hint}</p>` : ""}
  </div>`;
}
function inp(placeholder, extra) {
  return `<input placeholder="${placeholder || ""}" ${extra || ""} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px]" />`;
}
function sel(options, extra) {
  return `<select ${extra || ""} class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px] bg-white">${options.map(o=>`<option>${o}</option>`).join("")}</select>`;
}
function ta(placeholder, rows) {
  return `<textarea placeholder="${placeholder || ""}" rows="${rows || 3}" class="w-full border border-gray-300 rounded-md p-2 text-[13px]"></textarea>`;
}
function btn(label, opts) {
  opts = opts || {};
  const size = opts.small ? "px-3 py-1.5 text-[12px]" : "px-4 py-2 text-[13px]";
  const style = opts.primary ? `style="background:${NAVY}" class="text-white border border-transparent"` : `class="text-gray-700 border border-gray-300 bg-white hover:bg-gray-50"`;
  const nav = opts.nav ? `data-nav="${opts.nav}"` : "";
  return `<button type="button" ${nav} ${style.replace('class="', `class="inline-flex items-center gap-1.5 rounded-md font-medium ${size} `)}>
    ${opts.icon ? ic(opts.icon, "w-[14px] h-[14px]") : ""}${label}
  </button>`;
}
function table(cols, rows, navFn) {
  return `<div class="border border-gray-200 rounded-lg overflow-hidden">
    <table class="w-full text-[12px]">
      <thead><tr class="bg-gray-50 text-gray-500">${cols.map(c=>`<th class="text-left font-medium px-3 py-2 border-b border-gray-200">${c}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r,i)=>{
        const nav = navFn ? navFn(i) : null;
        return `<tr ${nav ? `data-nav="${nav}" class="border-b border-gray-100 last:border-0 cursor-pointer hover:bg-blue-50/60"` : `class="border-b border-gray-100 last:border-0"`}>${r.map(c=>`<td class="px-3 py-2 text-gray-700">${c}</td>`).join("")}</tr>`;
      }).join("")}</tbody>
    </table>
  </div>`;
}
function tabs(items, active) {
  return `<div class="flex gap-1 mb-4 border-b border-gray-200">${items.map(t=>`<div class="px-3 py-2 text-[13px] font-medium border-b-2 ${t===active?'border-[#005088] text-[#005088]':'border-transparent text-gray-500'}">${t}</div>`).join("")}</div>`;
}
function checklist(items) {
  return `<div class="space-y-2">${items.map((it,i)=>`<label class="flex items-center gap-2 text-[13px] text-gray-700"><input type="checkbox" ${i%2===0?"checked":""} class="rounded border-gray-300"/>${it}</label>`).join("")}</div>`;
}
function ipNotice() {
  return `<div class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-md px-3 py-2 text-[12px] text-amber-800 mb-4">${ic("shield-check","w-[14px] h-[14px]")}지정된 IP에서만 접속 가능한 특수고객 창구입니다 (SFR-온기업-002 인증 정책)</div>`;
}
function backBar(to, label) {
  return `<button type="button" data-nav="${to}" class="flex items-center gap-1.5 text-[12px] font-medium text-gray-500 hover:text-[#005088] mb-4">${ic("arrow-left","w-[14px] h-[14px]")}${label} 목록으로</button>`;
}
function infoGrid(items) {
  return `<div class="grid grid-cols-2 gap-x-6 gap-y-3">${items.map(([l,v])=>`<div><p class="text-[11px] text-gray-400 mb-0.5">${l}</p><p class="text-[13px] text-gray-800 font-medium">${v}</p></div>`).join("")}</div>`;
}
function timeline(steps, current) {
  return `<div class="flex items-center">${steps.map((s,i)=>{
    const done = i <= current;
    const circle = i < current
      ? `<div class="w-7 h-7 rounded-full flex items-center justify-center text-white" style="background:${NAVY}">${ic("check-circle-2","w-[14px] h-[14px]")}</div>`
      : `<div class="w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-medium ${done?'text-white':'bg-white border border-gray-300 text-gray-400'}" ${done?`style="background:${NAVY}"`:""}>${i+1}</div>`;
    const line = i < steps.length-1 ? `<div class="flex-1 h-0.5 mb-5" style="background:${i<current?NAVY:'#E5E7EB'}"></div>` : "";
    return `<div class="flex flex-col items-center flex-1">${circle}<span class="text-[10.5px] mt-1.5 text-center ${done?'font-medium':'text-gray-400'}" ${done?`style="color:${NAVY}"`:""}>${s}</span></div>${line}`;
  }).join("")}</div>`;
}
function gnb(title, sub) {
  return `<div>
    <div class="flex items-center justify-between px-6 h-14 text-white" style="background:${NAVY}">
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 bg-white rounded flex items-center justify-center text-[12px] font-medium" style="color:${NAVY}">캠</div>
        <span class="text-[15px] font-medium">온기업(OnCorp)</span>
        ${sub ? `<span class="text-[11px] text-white bg-white/20 px-2 py-0.5 rounded font-medium">${sub}</span>` : ""}
      </div>
      <div class="flex items-center gap-4 text-[12px] text-blue-100">
        ${ic("bell","w-[15px] h-[15px]")}<span>My Page</span>
        <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">${ic("user","w-[14px] h-[14px]")}</div>
      </div>
    </div>
    <div class="bg-white px-6 py-2 text-[12px] text-gray-500 border-b border-gray-200 flex items-center gap-1.5">
      ${ic("home","w-[13px] h-[13px]")}<span>홈</span>${ic("chevron-right","w-3 h-3")}<span style="color:${NAVY}" class="font-medium">${title}</span>
    </div>
  </div>`;
}
function shell(gnbTitle, body, gnbSub) {
  return `<div class="bg-[#F5F7FA] rounded-xl overflow-hidden border border-gray-200">${gnb(gnbTitle, gnbSub)}<div class="p-7">${body}</div></div>`;
}

/* ================= FO-BO 필드 단위 연계(ICD) 표시 헬퍼 =================
   SFR-온기업-021~032(FO) ↔ SFR-펀드관리-001~044(BO) 1:1 매핑 결과 반영용
   boLink   : 화면 상단, 이 화면이 근거로 삼는 BO 요건번호 칩 스트립
   fBadge   : 필드 라벨 옆 상태 배지(신규/자동계산/확인필요)
   gapBox   : 화면 하단, BO 요건 대비 격차·확인필요 사항 안내 박스
================================================================= */
function boLink(codes, note) {
  const chips = codes.map(c => {
    const gap = /확인필요|개념/.test(c);
    return `<span class="inline-flex items-center gap-1.5 text-[11px] font-mono font-semibold px-2.5 py-1 rounded-full border ${gap ? 'bg-amber-50 border-amber-200 text-amber-800' : ''}"
      ${gap ? '' : `style="color:${NAVY_DARK};background:#E6EDFA;border-color:#C9D9F5"`}>
      ${ic(gap ? "alert-triangle" : "link-2", "w-3 h-3")}${c}
    </span>`;
  }).join("");
  return `<div class="flex flex-wrap items-center gap-2 mb-4">
    <span class="text-[11px] text-gray-400 font-medium">BO 연계 요건</span>${chips}
    ${note ? `<span class="text-[11px] text-gray-400">${note}</span>` : ""}
  </div>`;
}
function fBadge(kind) {
  const map = {
    new:   ["신규", "bg-green-50 text-green-700"],
    calc:  ["자동계산", "bg-amber-50 text-amber-700"],
    gap:   ["확인필요", "bg-red-50 text-red-700"],
  };
  const [label, cls] = map[kind] || map.new;
  return `<span class="text-[9.5px] font-bold px-1.5 py-0.5 rounded ${cls} align-middle ml-1.5">${label}</span>`;
}
function gapBox(html) {
  return `<div class="mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[11.5px] text-red-800 leading-relaxed flex gap-2">
    ${ic("alert-triangle", "w-[14px] h-[14px] flex-shrink-0 mt-0.5")}<div>${html}</div>
  </div>`;
}

/* ================= 재사용 보고이력→상세 템플릿 (특수창구 023~029,031) ================= */
function reportHistory(data, screenId, cols) {
  return card("clock", "최근 보고 이력 (클릭 시 상세 조회)",
    table(cols, data.map(d=>d.row), (i)=>`/${screenId}/${data[i].id}`)
  );
}
function reportDetail(item, screenId, sfr, screenLabel, listName) {
  return `${backBar('/'+screenId, listName)}
  ${scrHeader(sfr, screenLabel + ' 상세', 'ONC-SCR-' + screenId, item.title)}
  ${card("file-text","보고 기본정보", infoGrid(item.info))}
  ${card("refresh-cw","진행상태", timeline(["작성","전송","공사 접수","확정"], item.stage))}
  ${item.content ? card("clipboard-list","보고 내용", `<p class="text-[13px] text-gray-700 leading-relaxed">${item.content}</p>`) : ""}
  ${card("paperclip","첨부파일", `<div class="flex items-center justify-between border rounded-lg p-3 text-[12px]">
      <div class="flex items-center gap-2">${ic("file-text","w-[14px] h-[14px]")}${item.file || "보고서_첨부.pdf"}</div>
      ${btn("다운로드", {small:true, icon:"download"})}
    </div>`)}
  <div class="flex justify-end gap-2">${btn("수정",{})}${btn("재전송",{primary:true, icon:"send"})}</div>`;
}

RENDERERS["031"] = reportScreen("031", R031, ["펀드구분","운용지시종류","운용지시일","제목","진행현황"], "SFR-온기업-031",
  "운용지시서",
  card("file-signature","운용지시서 생성"+fBadge("new"), `<p class="text-[11.5px] text-gray-500 mb-2">표준 양식 기반 — 출자/배분/투자/회수/투자자산변동/환전/계좌간이체/일반자금운용/출자증서관리/기타(BO-010)</p>${field("운용지시 유형",false,sel(["출자","배분","투자","회수","투자자산변동","환전","계좌간이체","일반자금운용","출자증서관리","기타"]))}`)
  + card("send","운용지시 결과 보고 및 전송", `${field("처리현황 등록",false,ta("",2))}${btn("전송 (진행상태: 전송/접수/확정)",{primary:true, icon:"send"})}`),
  ["SFR-펀드관리-010"]
);

RENDERERS["032"] = (detailId) => {
  if (detailId) {
    const r = RECON_ITEMS.find(x=>x.id===detailId) || RECON_ITEMS[0];
    return shell("정보대사 관리", `
      ${backBar("/032","정보대사 목록")}
      ${scrHeader("SFR-온기업-032", r.label + " 대사 상세","ONC-SCR-032-D")}
      ${card("database","대사 결과", infoGrid([["공사 시스템 값",r.sysval],["수탁기관 값",r.trustval],["일치여부",statusPill(r.match,r.tone)]]))}
      ${r.memo ? card("message-square","소통 이력", `<p class="text-[13px] text-gray-700">${r.memo}</p><div class="mt-3">${field("소명 답변 등록",false,ta("",2))}</div>${btn("답변 등록",{primary:true, icon:"send"})}`) : ""}
    `, "특수창구");
  }
  return shell("정보대사 관리", `
    ${ipNotice()}
    ${scrHeader("SFR-온기업-032","[특수] 수탁기관 - 정보대사 관리 등","ONC-SCR-032","[SFR-펀드관리-010] 연계 · 계좌/보유자산/입출금/잔고 정보대사")}
    ${boLink(["SFR-펀드관리-010"])}
    ${field("대사 주기"+fBadge("new"), false, sel(["일간","주간","월간"]), "BO-010 원문 기준 — 대사주기별 이력 조회 필터")}
    ${card("database","수탁기관 정보대사 (클릭 시 상세)", table(["항목","공사 시스템 값","수탁기관 값","일치여부"], RECON_ITEMS.map(r=>[r.label,r.sysval,r.trustval,statusPill(r.match,r.tone)]), (i)=>`/032/${RECON_ITEMS[i].id}`))}
    ${gapBox("소통 관리(수탁기관 ↔ 공사 게시판)는 FO 화면에 존재하지만 BO-010 원문에는 게시판 기능이 명시되어 있지 않습니다. BO-022(운용사 소통) 패턴을 수탁기관용으로 별도 신설할지 발주처 확인이 필요합니다.")}
  `, "특수창구");
};

/* shell 함수는 3번째 인자로 gnbSub을 받도록 이미 정의됨 -- 위 호출부와 매칭 확인용 래퍼 불필요 */

/* ================= 라우터 & 렌더링 ================= */
function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "") || "/011";
  const segs = raw.split("/").filter(Boolean);
  return { screenId: segs[0] || "011", detailId: segs[1], raw: "/" + segs.join("/") };
}
function renderSidebar(activeId) {
  const groups = [...new Set(SCREENS.map(s=>s.group))];
  const html = `
    <div class="px-4 py-4 border-b border-gray-100">
      <p class="text-[13px] font-medium" style="color:${NAVY}">온기업(OnCorp) 화면설계서</p>
      <p class="text-[11px] text-gray-400 mt-0.5">SFR-온기업-002 ~ 032 · HTML/CSS/JS 버전</p>
    </div>
    ${groups.map(g=>`
      <div class="py-2">
        <p class="px-4 text-[11px] font-medium text-gray-400 uppercase mb-1">${g}</p>
        ${SCREENS.filter(s=>s.group===g).map(s=>`
          <button type="button" data-nav="/${s.id}" class="w-full text-left px-4 py-2 text-[12.5px] flex items-center gap-2 ${s.id===activeId?'font-medium':'text-gray-600 hover:bg-gray-50'}"
            ${s.id===activeId?`style="background:#E6F1FB;color:${NAVY_DARK};border-right:3px solid ${NAVY}"`:""}>
            <span class="font-mono text-[10px] text-gray-400 w-8">${s.id}</span>${s.name}
          </button>`).join("")}
      </div>`).join("")}
  `;
  document.getElementById("sidebar").innerHTML = html;
}
function renderApp() {
  const { screenId, detailId, raw } = parseHash();
  renderSidebar(screenId);
  const renderer = RENDERERS[screenId] || RENDERERS["011"];
  document.getElementById("content").innerHTML = renderer(detailId);
  document.getElementById("pathbar").innerHTML = `<span>#${raw}</span>${detailId?` <span class="text-gray-300">/</span> <span class="text-gray-500">상세보기</span>`:""}`;
  if (window.lucide) lucide.createIcons();
  window.scrollTo(0,0);
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-nav]");
  if (el) { e.preventDefault(); location.hash = el.getAttribute("data-nav"); }
});
window.addEventListener("hashchange", renderApp);
window.addEventListener("DOMContentLoaded", renderApp);
</script>
